<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RetComM Studio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- Same card language as RetComM Launcher -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="96" y="128" width="320" height="256" rx="28" fill="none" stroke="url(#accent)" stroke-width="28"/>
  <!-- Code brackets (studio) instead of hub UI bars -->
  <path d="M200 188 L152 256 L200 324" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 188 L360 256 L312 324" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center accent chip -->
  <rect x="228" y="236" width="56" height="40" rx="10" fill="url(#accent)" opacity="0.85"/>
</svg>
