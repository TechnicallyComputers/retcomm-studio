name: Release

# Manual only — does not run on push/PR. Leave version empty to auto-bump the
# next x.x.x from the latest vX.Y.Z tag, then publish a GitHub Release after a
# successful multi-platform build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Semver without leading v (e.g. 0.1.2). Leave empty to auto-bump from
          the latest vX.Y.Z git tag (see bump).
        required: false
        type: string
        default: ""
      bump:
        description: "When version is empty, which semver component to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        required: false
        default: patch
      prerelease:
        description: "Mark GitHub release as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  SDL_TAG: "release-3.2.16"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]')"
          BUMP="${{ inputs.bump || 'patch' }}"

          bump_semver() {
            local base="$1" which="${2:-patch}"
            local ma mi pa
            base="${base#v}"
            base="${base%%[-+]*}"
            if [[ ! "${base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::cannot bump non-semver base '${base}'" >&2
              exit 1
            fi
            IFS=. read -r ma mi pa <<<"${base}"
            ma="${ma:-0}"; mi="${mi:-0}"; pa="${pa:-0}"
            case "${which}" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              patch) pa=$((pa + 1)) ;;
              *)
                echo "::error::unknown bump '${which}' (want patch|minor|major)" >&2
                exit 1
                ;;
            esac
            printf '%s.%s.%s' "${ma}" "${mi}" "${pa}"
          }

          if [[ -z "${RAW}" ]]; then
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
            BASE="${LATEST#v}"
            if [[ -z "${BASE}" ]]; then
              BASE="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
              BASE="${BASE#v}"
              BASE="${BASE%%[-+]*}"
            fi
            BASE="${BASE:-0.0.0}"
            VER="$(bump_semver "${BASE}" "${BUMP}")"
            echo "Auto-bumped ${BUMP}: ${LATEST:-none (${BASE})} → ${VER}"
          else
            VER="${RAW#v}"
            if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
              echo "::error::Invalid version: ${VER} (expected semver like 0.1.2)" >&2
              exit 1
            fi
          fi

          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || \
             git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag ${TAG} already exists — bump again or pass an explicit version" >&2
            exit 1
          fi

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building RetComM Studio ${VER} (tag ${TAG})"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libfreetype6-dev \
            librsvg2-bin imagemagick curl ca-certificates \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libibus-1.0-dev libudev-dev fuse libfuse2

      - name: Build icons
        run: |
          chmod +x packaging/make-icons.sh packaging/linux/*.sh
          ./packaging/make-icons.sh
          test -f assets/retcomm-studio.png
          test -f assets/fonts/LatoLatin-Regular.ttf

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch "${SDL_TAG}" https://github.com/libsdl-org/SDL.git "$HOME/SDL"
          cmake -G Ninja -S "$HOME/SDL" -B "$HOME/sdl-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build "$HOME/sdl-build" -j"$(nproc)"
          cmake --install "$HOME/sdl-build"

      - name: Configure & build Studio
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DCMAKE_PREFIX_PATH="$HOME/sdl3"
          cmake --build build -j"$(nproc)"
          cmake --install build
          test -f out/bin/RetComM-Studio
          test -d out/share/retcomm-studio/toolkit/project_studio
          test -f out/share/retcomm-studio/fonts/LatoLatin-Regular.ttf
          mkdir -p out/lib
          cp -a "$HOME/sdl3/lib/"*.so* out/lib/

      - name: Package AppImage
        run: |
          export PATH="$HOME/sdl3/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          ./packaging/linux/build-appimage.sh "$PWD/out" "${{ needs.version.outputs.version }}" x86_64
          test -f dist/RetComM-Studio-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/RetComM-Studio-linux-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-2022
    env:
      RETCOMM_VCPKG: ${{ github.workspace }}/retcomm-vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = "9d7f79f56ae1a9b4704d6a7fb8237e347a974133"
          git clone https://github.com/microsoft/vcpkg.git $env:RETCOMM_VCPKG
          git -C $env:RETCOMM_VCPKG checkout $baseline
          $metaPath = Join-Path $env:RETCOMM_VCPKG "scripts\vcpkg-tool-metadata.txt"
          $meta = ConvertFrom-StringData (Get-Content $metaPath -Raw)
          $tag = $meta.VCPKG_TOOL_RELEASE_TAG
          $url = "https://github.com/microsoft/vcpkg-tool/releases/download/$tag/vcpkg.exe"
          $dest = Join-Path $env:RETCOMM_VCPKG "vcpkg.exe"
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
            if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Force }
            & curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 2 `
              --connect-timeout 30 --max-time 300 -o $dest $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $dest) -and ((Get-Item $dest).Length -gt 1MB)) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds ([Math]::Min(60, 3 * $i))
          }
          if (-not $ok) { throw "Failed to download vcpkg.exe" }
          Set-Content -LiteralPath (Join-Path $env:RETCOMM_VCPKG "vcpkg.disable-metrics") -Value ""
          & $dest version --disable-metrics

      - name: Build icons
        shell: bash
        run: |
          chmod +x packaging/make-icons.sh
          ./packaging/make-icons.sh
          test -f assets/retcomm-studio.ico
          test -f assets/fonts/LatoLatin-Regular.ttf

      - name: Configure & build
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="${RETCOMM_VCPKG}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DCMAKE_INSTALL_PREFIX="$PWD/out"
          cmake --build build --config Release -j
          cmake --install build --config Release
          test -f out/bin/RetComM-Studio.exe
          test -d out/share/retcomm-studio/toolkit/project_studio

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after innosetup install" }

      - name: Package portable + installer
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 `
            -Prefix "$PWD/out" `
            -Version "${{ needs.version.outputs.version }}" `
            -Arch x64 `
            -VcpkgBin "$env:RETCOMM_VCPKG/installed/x64-windows/bin" `
            -InnoSetup "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $need = @(
            "RetComM-Studio-portable-windows.zip",
            "RetComM-Studio-windows-x64-setup.exe"
          )
          foreach ($n in $need) {
            $p = Join-Path dist $n
            if (-not (Test-Path $p)) { throw "Missing release artifact: $n" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/RetComM-Studio-portable-windows.zip
            dist/RetComM-Studio-windows-x64-setup.exe

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install cmake ninja sdl3 freetype librsvg || brew install cmake ninja sdl3 freetype

      - name: Build icons
        run: |
          chmod +x packaging/make-icons.sh packaging/macos/build-dmg.sh
          ./packaging/make-icons.sh
          test -f assets/retcomm-studio.png
          test -f assets/fonts/LatoLatin-Regular.ttf

      - name: Configure & build
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out"
          cmake --build build -j
          cmake --install build
          test -f out/bin/RetComM-Studio
          test -d out/share/retcomm-studio/toolkit/project_studio

      - name: Package DMG
        run: |
          ./packaging/macos/build-dmg.sh \
            "$PWD/out" \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.arch }}"
          test -f "dist/RetComM-Studio-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/RetComM-Studio-macos-${{ matrix.arch }}.dmg

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp -v {} dist/ \;
          ls -lah dist/
          test -n "$(ls -A dist)" || { echo "No release artifacts found" >&2; exit 1; }
          test -f dist/RetComM-Studio-linux-x86_64.AppImage
          test -f dist/RetComM-Studio-windows-x64-setup.exe
          test -f dist/RetComM-Studio-portable-windows.zip
          test -f dist/RetComM-Studio-macos-arm64.dmg
          test -f dist/RetComM-Studio-macos-x86_64.dmg

      - name: Ensure release tag exists
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally (from fetch)."
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            echo "Creating annotated tag ${TAG} at ${GITHUB_SHA}"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "RetComM Studio ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: RetComM Studio ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
